# ShopKart API on Kubernetes — SIMULATION deployment (local kind cluster).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopkart-api
  namespace: shopkart
  labels:
    app: shopkart-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopkart-api
  template:
    metadata:
      labels:
        app: shopkart-api
    spec:
      containers:
        - name: api
          image: shopkart-api:latest  # build locally; no registry push in this simulation
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
